<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="bannerTitle bannerDesc">
  <title id="bannerTitle">Shobdo Keyboard</title>
  <desc id="bannerDesc">Shobdo Keyboard: Bangla, Banglish and English typing for Android, offline and private.</desc>
  <defs>
    <linearGradient id="bannerBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="320" fill="url(#bannerBg)"/>

  <!-- Mark -->
  <g transform="translate(64 64)">
    <rect x="0" y="0" width="192" height="192" rx="56" fill="#FFFFFF" fill-opacity="0.10"/>
    <g fill="none" stroke="#F8FAFC" stroke-width="20" stroke-linecap="round" stroke-linejoin="round">
      <path d="M46 60 H128"/>
      <path d="M112 60 V148"/>
      <path d="M46 60 V104 C46 132 64 148 90 148 C108 148 122 136 122 118"/>
    </g>
    <circle cx="164" cy="164" r="13" fill="#6366F1"/>
  </g>

  <!-- Wordmark -->
  <text x="312" y="146" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="66" font-weight="700" fill="#F8FAFC">Shobdo Keyboard</text>
  <text x="314" y="196" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="27" fill="#94A3B8">Bangla · Banglish · English — offline and private</text>
  <rect x="314" y="222" width="180" height="6" rx="3" fill="url(#rule)"/>
</svg>
